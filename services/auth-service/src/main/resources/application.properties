spring.application.name=auth-service

# ===============================
# Server Configuration
# ===============================
server.port=7171

# ===============================
# Database Configuration (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_service
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# JWT Configuration
# ===============================
jwt.secret=${JWT_SECRET}
# Access token expiration: 24 hours (in milliseconds)
jwt.access-token-expiration=86400000
# Refresh token expiration: 7 days (in milliseconds)
jwt.refresh-token-expiration=604800000

# ===============================
# Logging Configuration
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.com.project.authservice=DEBUG


